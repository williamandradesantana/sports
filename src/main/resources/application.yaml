server:
  port: 8080

spring:
  application:
    name: sports-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  output:
    ansi:
      enabled: ${OUTPUT_ANSI_ENABLED:ALWAYS}
  main:
    banner-mode: OFF

  scalar:
    enabled: true
    sources:
      - url: /v3/api-docs/v1
        isDefault: true
      - url: /v3/api-docs/v2
        isDefault: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
  leagues:
    external-ids: ${TRACKED_LEAGUE_EXTERNAL_IDS:71}
  scheduling:
    league-sync-cron: ${LEAGUE_SYNC_CRON:0 */20 * * * *}
    team-sync-cron: ${TEAM_SYNC_CRON:0 0 4 * * *}
    match-sync-cron: ${MATCH_SYNC_CRON:0 0 5 * * *}
    odds-sync-cron: ${ODDS_SYNC_CRON:0 */15 * * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bookmakers:
    external-ids: ${TRACKED_BOOKMAKER_EXTERNAL_IDS:8,18}
  odds:
    capture-window-hours: ${ODDS_CAPTURE_WINDOW_HOURS:6}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

api-football:
  base-url: ${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
  api-key: ${API_FOOTBALL_API_KEY}