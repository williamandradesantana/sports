services:
  postgres:
    image: postgres:16-alpine
    container_name: sports_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OUTPUT_ANSI_ENABLED: ${OUTPUT_ANSI_ENABLED}

    ports:
      - "${POSTGRES_PORT}:5432"